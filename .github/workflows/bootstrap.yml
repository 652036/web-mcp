name: Bootstrap Forkcast source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Rebuild source archive
        run: |
          cat .bootstrap/chunk-* | base64 --decode > /tmp/forkcast.tar.gz
          tar -xzf /tmp/forkcast.tar.gz
          rm -rf .bootstrap /tmp/forkcast.tar.gz
      - name: Commit source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: ship Forkcast WebMCP decision studio"
          git push
